# ============================================================================
# File này KHÔNG được code đọc. Policy thật nằm ở:
#
#     src/dire_modal/tiers.yaml
#
# Lý do: Modal chỉ đóng gói thư mục của module được chạy, nên function thấy
# /root/dire_modal/tiers.yaml trong container nhưng KHÔNG thấy configs/ ở repo
# root. Đặt policy trong package là cách duy nhất để nó đi theo code.
#
# File này chỉ là bảng tra cứu nhanh cho người đọc. Muốn đổi tier mặc định,
# trần dung lượng hay số container song song → sửa src/dire_modal/tiers.yaml.
# ============================================================================

# ---- bảng tra cứu tier (inventory đầy đủ: src/dire_modal/manifest.py) -------
#
#  Số file và GB là SỐ ĐO THẬT từ `download::audit` ngày 2026-10-21.
#
#  tier    file   size      mục đích
#  ------  -----  --------  --------------------------------------------------
#  e0          0  —         code / tooling / docs — không tải gì
#  e1          0  —         demo AEROBLADE zero-shot — VAE (~1 GB) từ HF Hub
#  e2min       3  ~0.40 GB  ĐƯỜNG NGẮN NHẤT: lsun_adm.pth + test real + test adm ⭐
#  e2         17  1.94 GB   eval headline DIRE trên LSUN-Bedroom, 16 gen ⭐
#  e3         24  4.85 GB   cross-domain: 10 tar lsun/imagenet, ImageNet, CelebA-HQ
#  e4          5  1.45 GB   eval AEROBLADE trên ẢNH GỐC (images/)       ⭐
#  e4x        17  3.47 GB   AEROBLADE mọi generator (DirSpec, tự loại 8 ddim)
#  e5         11  2.11 GB   ensemble + hiệu chỉnh ngưỡng (val đủ 5 tar)
#  train       4  5.74 GB   train lại detector headline từ đầu
#  trainx      7 11.24 GB   train lại detector cross-domain
#  trainens    3 14.60 GB   train 3 detector ensemble
#  rawx        4  4.48 GB   ảnh gốc để TỰ tính lại DIRE (GPU + ADM 2.5 GB)
#  rawxens     6 12.10 GB   ảnh gốc cho ensemble
#  ckpts       6  1.58 GB   toàn bộ checkpoint detector (mỗi file 269.4 MB)
#
#  Mặc định e2+e4 = 22 file / 3.39 GB   ·   eval đầy đủ e2..e5 = 57 file / 10.35 GB
#  Toàn cây đã audit = 104 file / 61.40 GB, trong đó 47.00 GB (77%) là TRAIN.
#  Con số "Tier A ≈ 40–70 GB" trong docs cũ là của CẢ CÂY, sai 5.4–9.4 lần.
#
#  alias cũ: ckpt→ckpts · A→e2,train · B→e3 · C→rawx · D→(bị NEVER chặn, rỗng)
#
# ---- Tải: tốc độ + resume xuyên container ----------------------------------
#
#  dire_staging        ".staging"  staging trong /raw (env DIRE_STAGING_DIR ghi đè)
#  baidu_parallel      1           số kết nối/file (-p). BẮT BUỘC = 1 với user free:
#                                  tăng lên bị throttle về ~0 tốc độ nhiều giờ–nhiều ngày
#  baidu_mode          ""          --mode của BaiduPCS-Go: locate|pcs|stream
#                                  ("" = mặc định client). Đo: scripts/09_bench_mode.sh
#  max_containers      1           SỐ ĐO 2026-10-25: k=1 76.6 KiB/s vs k=2 75.0 KiB/s
#                                  ⇒ trần là của TÀI KHOẢN, thêm container không nhanh hơn
#  --paths             (cờ CLI)    tải đúng danh sách file, không cần tier
#  staging_commit_s    45          commit Volume định kỳ khi đang tải ⇒ resume
#                                  sống qua container chết (clamp [0, 600])
#
#  Bản cũ tải vào /tmp ⇒ container chết là mất tiến độ, và bước sang /raw phải
#  COPY toàn bộ file. Nay staging trong Volume ⇒ os.replace (O(1)) + resume.

# ---- Guard chi phí GPU (compute_dire.py) — copy từ src/dire_modal/tiers.yaml --
#
#  dire_max_containers    4        clamp cứng [1, 16]
#  dire_timeout_s         1800     clamp cứng [60, 3600]  (bản cũ: 24 h)
#  dire_max_usd           5.0      preflight từ chối nếu vượt
#  dire_max_images        500      chặn trước cả khi tính tiền
#  dire_usd_per_gpu_hour  2.5      A100
#  dire_sec_per_image     5.0      bảo thủ — đo thật bằng scripts/06_measure_dire.sh
#
#  Trần xấu nhất: 4 × 0.5 h × $2.50 = $5  (bản cũ: 40 × 24 h ≈ $2 400)

# ---- NEVER (chặn cứng, không tier nào với tới) ------------------------------
#
#  recons/           44 tar ảnh reconstruction — detector đọc dire/ có sẵn
#  *ddim*             8 tar ablation số bước DDIM (audit đếm 8, 2 tar chỉ 130 B)
#  lsun_bedroom.pt    weight ADM 2.5 GB — không có trong cây Baidu
#
# ---- luồng chạy -------------------------------------------------------------
#
#  ./scripts/01_fetch_baidu.sh          # audit → plan → hỏi → fetch → verify
#
#  hoặc từng bước:
#    modal run -m dire_modal.download::local_status          # local, 0 credit
#    modal run -m dire_modal.download::audit                 # cây remote ↔ manifest
#    modal run -m dire_modal.download::plan --tiers e2,e4    # size thật, không tải
#    modal run -m dire_modal.download::main --tiers e2,e4 --mode fetch
#    modal run -m dire_modal.download::verify                # gzip -t toàn bộ
#    modal run -m dire_modal.download::prune --tiers e2,e4   # file tải thừa
#
#  Tái lập bằng checkpoint PRE-TRAINED (không train lại — spec.md N1):
#    modal run -m dire_modal.download::main --tiers e2min --mode fetch
#    modal run -m dire_modal.eval::main --tiers e2min        # in CỔNG S2
#    bash scripts/08_repro_minimal.sh                        # gói cả hai
#
#  Khi đã có mirror HF (nhanh hơn Baidu 1–2 bậc):
#    modal run -m dire_modal.download::from_hf --repo-id <user>/<repo> --tiers e2

# Khóa duy nhất để file này là YAML hợp lệ (file toàn comment sẽ parse thành
# None). Code không đọc giá trị này.
source_of_truth: "src/dire_modal/tiers.yaml"
