[project]
name = "dire-modal"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "modal>=0.64",
    "pyyaml>=6.0",
    "boto3>=1.34",
    "tqdm>=4.66",
]

# `dire` — CLI tại máy nhà. Cùng lõi `dire_core` với đường Modal, nên điểm số
# không thể lệch. Chạy `pip install -e .` là có lệnh; hoặc python -m dire_local.cli.
[project.scripts]
dire = "dire_local.cli:main"

[project.optional-dependencies]
# Chỉ cần cho `dire detect/batch/serve` và cho eval thật.
infer = ["torch>=2.0", "torchvision>=0.15", "pillow>=10.0"]
# `dire serve` / `dire_modal.api`.
api = ["fastapi>=0.110", "uvicorn>=0.29"]
# Bản viết lại clean-room (`dire_zero`) — torch + numpy + pillow là đủ.
zero = ["torch>=2.0", "numpy>=1.24", "pillow>=10.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dire_core*", "dire_local*", "dire_modal*", "dire_zero*"]
