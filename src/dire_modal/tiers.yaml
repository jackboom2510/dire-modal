# ============================================================================
# CHÍNH SÁCH TẢI DỮ LIỆU — nguồn sự thật cho tier mặc định / trần dung lượng /
# số container song song.
#
# File này nằm TRONG package (src/dire_modal/) chứ không phải configs/ ở repo
# root, vì Modal chỉ đóng gói thư mục của module được chạy — function chạy
# trong container sẽ thấy /root/dire_modal/tiers.yaml nhưng KHÔNG thấy
# /root/configs/. manifest.py::load_policy() đọc file này và có fallback cứng
# nếu thiếu, nên pipeline không bao giờ chết vì config.
#
# Danh sách FILE cụ thể nằm ở manifest.py (inventory); file này chỉ chứa
# POLICY. Tách đôi như vậy để đổi chính sách không phải đụng inventory.
#
# Mọi con số GB dưới đây là SỐ ĐO THẬT từ `download::audit` ngày 2026-10-21,
# không phải ước lượng.
# ============================================================================
version: 2

# Tier tải mặc định khi không truyền --tiers.
#   e2 = eval headline DIRE trên LSUN-Bedroom (1 ckpt + 16 tar test) = 1.94 GB
#   e4 = eval AEROBLADE trên ảnh gốc (5 tar images/)                 = 1.45 GB
#   ---------------------------------------------------------------
#   Tổng 22 file = 3.39 GB, so với 61.40 GB toàn cây đã audit.
# Tier A cũ (20 file) thực tế là 7.42 GB — docs từng ghi "40–70 GB" là lấy số
# của CẢ CÂY gán nhầm cho Tier A.
default_tiers: "e2,e4"

# Trần dung lượng cho MỘT lần `main --mode fetch`. Vượt → từ chối, không tải.
#
# 25 GB được chọn có chủ đích sau khi có số đo thật:
#   * eval đầy đủ không train (e2+e3+e4+e5) = 10.35 GB  → lọt, đúng ý
#   * thêm e4x (AEROBLADE mọi generator)     = 12.37 GB  → lọt, đúng ý
#     (e4 ⊂ e4x nên union là 69 file, không phải 57+17 — expand() khử trùng
#      lặp theo đường dẫn remote, không theo object)
#   * trainens một mình (3 tar train)        = 14.60 GB  → lọt (cần nếu train)
#   * train + trainx + trainens + rawx*      = 48.16 GB  → CHẶN
# tức trần này chặn được việc vô tình kéo cả đống dữ liệu train (47 GB = 77%
# cả cây) trong khi vẫn đủ rộng cho mọi tổ hợp eval.
#
# Guard so với ƯỚC LƯỢNG BẢO THỦ, không phải tổng size đã biết: file nào ls -l
# không đọc được size thì bị tính bằng file lớn nhất đã biết. Nếu chỉ so tổng
# đã biết thì guard là cận dưới và sẽ vô hiệu đúng lúc cần nó nhất.
max_gb: 25.0

# Số container tải song song TỐI ĐA = 1. Đây là SỐ ĐO, không phải suy đoán.
#
# `download::bench_concurrency --tiers e2 --limit 2 --ks 1,2` (2026-10-25,
# 387.7 MB/lượt):
#     k=1 : 5 183.8 s → 76.6 KiB/s
#     k=2 : 5 293.3 s → 75.0 KiB/s   (mỗi file 37.5 KiB/s)
# ⇒ TRẦN ~77 KiB/s là của TÀI KHOẢN, không phải của container. Thêm container chỉ
# chia nhỏ miếng bánh: tổng không đổi, mỗi file chậm đi một nửa, và số phiên
# đồng thời tăng — đúng thứ Baidu dùng để throttle.
#
# (Số 67.36 KB/s mà policy cũ dựa vào là một quan sát đơn lẻ; số đo lặp lại được
#  là 76.6 KiB/s. Chênh giữa hai lần đo là dao động mạng, không phải cấu hình.)
#
# Muốn nhanh hơn thì phải ra khỏi Baidu: tải một lần rồi mirror lên HF Hub/Kaggle.
max_containers: 1

# Số lần thử lại cho MỖI file. Retry nằm BÊN TRONG fetch_one (vòng lặp thủ công)
# chứ không dựa vào modal.Retries, vì exception lọt ra ngoài .map() sẽ huỷ toàn
# bộ đợt tải và làm mất mọi file đang tải dở ở /tmp.
fetch_attempts: 3

# Timeout cho MỘT lệnh BaiduPCS-Go (giây) = 90 phút.
# Code cũ không đặt timeout ⇒ một phiên treo ở 0B/s có thể ngồi đó tới timeout
# của function (6 giờ) mà không bị giết.
#
# ⚠ Giá trị này KHÔNG còn là timeout hiệu lực: `_attempt_timeout()` cắt nó theo
# ngân sách còn lại của lần gọi (xem `download.FETCH_CALL_TIMEOUT_S`), và
# `stall_timeout_s` cắt sớm hơn nếu phiên treo hẳn. Nó là TRẦN cho một attempt.
# 2026-10-25: hạ 5400 → 1800. Lý do là số ĐO, không phải cảm giác:
#   * log thật cho 24.25 KB/s và 48.49 KB/s cho một phiên (không phải 67 KB/s).
#   * tar lớn nhất là 692.8 MB. Ở 48 KB/s nó cần 4.0 giờ — KHÔNG attempt nào
#     tải xong trong một lần, bất kể đặt 5400 hay 1800.
#   * Vậy resume mới là cơ chế chính, và attempt ngắn hơn = nhiều lần lấy phiên
#     mới hơn. Ở 5400s, một phiên đã bị throttle phải chờ 90 phút mới được thử
#     lại; ở 1800s là 30 phút.
#   * `stall_timeout_s` vẫn cắt sớm hơn nhiều khi phiên treo hẳn (0 B/s).
# Thư mục staging ổn định theo hash đường dẫn remote nên attempt sau resume được
# mảnh dở, không tải lại từ 0.
subprocess_timeout: 1800

# Giết BaiduPCS-Go nếu file trong staging không lớn thêm trong N giây.
#
# Vì sao cần: log thật 2026-10-25 cho thấy Baidu cắt băng thông giữa chừng và
# BaiduPCS-Go KHÔNG tự bỏ cuộc — nó in `↓ 153.69MB/154.19MB 0B/s in 42m48s` rồi
# ngồi đó tới hết `subprocess_timeout` (90 phút). Ba attempt như vậy = 4.5 giờ
# đốt vào 0 byte, và đó là một trong hai lý do lần chạy đó chết ở 18 000s.
#
# 600s: một file 154 MB ở 24 KB/s vẫn ghi được vài MB mỗi phút, nên 10 phút
# không lớn thêm nghĩa là phiên đã chết chứ không phải chỉ chậm. 0 = tắt.
stall_timeout_s: 600

# --- Tải: tốc độ + resume xuyên container -----------------------------------
#
# Bản trước tải vào /tmp của container. Hệ quả: container chết giữa chừng là
# mất tiến độ (BaiduPCS-Go resume dựa trên file dở còn nằm trong thư mục đích),
# và bước chuyển sang /raw phải COPY 692 MB qua FUSE vì khác filesystem.
#
# Nay staging nằm TRONG Volume: /raw/.staging/. Đổi lại:
#   + resume sống qua container chết (commit định kỳ bên dưới)
#   + bước công bố là os.replace() CÙNG filesystem ⇒ atomic, không copy
#   - mỗi write() của BaiduPCS-Go đi qua FUSE (67 KB/s thì không đáng kể)
#
# Muốn quay lại /tmp cho nhanh (đổi lại là mất resume xuyên container):
#     DIRE_STAGING_DIR=/tmp/baidu_staging modal run ...
dire_staging: ".staging"      # tên thư mục con trong /raw

# Số kết nối song song CHO MỘT FILE (cờ -p của BaiduPCS-Go) = 1, TƯỜNG MINH.
#
# Tài liệu của chính BaiduPCS-Go (fork qjfoidnh / BlueSkyXN) nói:
#   「普通用户请将 max_parallel 和 max_download_load 都设置为 1，调大线程数只会
#    在短时间内提升下载速度，且极易很快触发限速，导致几小时至几天内账号在各
#    客户端都接近 0 速。」
# Tức: user free phải để 1; tăng thread chỉ nhanh một lúc rồi KÍCH THROTTLE làm
# tài khoản về ~0 tốc độ trong nhiều giờ đến nhiều ngày.
#
# `0B/s in 42m48s` của lần chạy 2026-10-25 đúng là chữ ký đó — và nó xảy ra khi
# max_containers=2 với `-p` do client tự quyết. Đặt 1 ở CẢ HAI tầng.
baidu_parallel: 1

# `--mode` của BaiduPCS-Go: rỗng = không truyền (mặc định `locate` của client).
# Hợp lệ: locate | pcs | stream — ba API khác nhau của Baidu, lịch sử throttle
# khác nhau. Chỉ đổi khi đã đo: `scripts/09_bench_mode.sh`.
baidu_mode: ""

# Chu kỳ commit Volume khi đang tải (giây). 0 = chỉ commit sau khi file xong.
# Commit là thứ làm resume xuyên container có tác dụng; đặt quá nhỏ sẽ tốn
# thời gian vì mỗi commit phải đồng bộ với kho phân tán.
staging_commit_s: 45

# ============================================================================
# GUARD CHI PHÍ GPU (compute_dire.py) — đây là phần TIÊU TIỀN THẬT.
#
# Bản trước để cứng `max_containers=40` + `timeout=24*3600` trên A100. Một
# container treo bị tính tiền GPU suốt 24 giờ, nhân 40 container:
#     40 × 24 h × ~$2.50/h ≈ $2 400 cho MỘT lần chạy hỏng.
# Điểm chết người là timeout, không phải số container: một ảnh 256² × 20 step
# mất vài giây, nên timeout 24 h chỉ có tác dụng khi container TREO — đúng lúc
# nó tốn tiền nhất.
#
# Với cấu hình dưới đây, trần xấu nhất là 4 × 0.5 h × $2.50 = ~$5.
# ============================================================================

# Số container GPU song song tối đa. Code clamp cứng ở [1, 16] để một dòng
# config sai không thể bật lại 40 container.
dire_max_containers: 4

# Timeout cho MỘT ảnh (giây). 1800 s = 30 phút, gấp ~300 lần thời gian thật
# của một ảnh ⇒ đủ rộng cho ảnh lớn/GPU chậm, đủ hẹp để một lần treo không
# thành hoá đơn. Đây là trần chi phí thật của một lần chạy.
dire_timeout_s: 1800

# Trần chi phí cho MỘT lần chạy (USD). Preflight tính tiền trước khi bật
# container nào; vượt trần thì TỪ CHỐI, phải --force mới chạy.
dire_max_usd: 5.0

# Trần số ảnh cho một lần chạy, chặn trước cả khi tính tiền.
dire_max_images: 500

# Giá A100 (USD/GPU-giờ). Modal tính theo giây GPU thực dùng.
dire_usd_per_gpu_hour: 2.5

# Giây/ảnh, BẢO THỦ. Đo thật bằng `scripts/06_measure_dire.sh` rồi cập nhật;
# preflight dùng số này nên ước tính sẽ sai đúng bằng mức sai của nó.
dire_sec_per_image: 5.0

# Ghi chú mục đích từng tier — chỉ để in ra cho người đọc, không ảnh hưởng logic.
# Số file và GB là số đo thật (audit 2026-10-21).
tiers:
  e0:       "code/tooling/docs — 0 file, không tải gì từ Baidu"
  e1:       "demo AEROBLADE zero-shot — 0 file Baidu; chỉ cần VAE (~1 GB) từ HF Hub"
  e2min:    "3 file · ~0.40 GB · ĐƯỜNG NGẮN NHẤT: lsun_adm.pth + test real + test adm (cổng S2) ⭐"
  e2:       "17 file · 1.94 GB · eval headline DIRE trên LSUN-Bedroom, 16 generator ⭐"
  e3:       "24 file · 4.85 GB · cross-domain: +10 tar lsun/imagenet, ImageNet, CelebA-HQ"
  e4:       "5 file · 1.45 GB · eval AEROBLADE trên ẢNH GỐC (nhánh images/) ⭐"
  e4x:      "17 file · 3.47 GB · AEROBLADE MỌI generator (DirSpec, tự loại 8 file ddim)"
  e5:       "11 file · 2.11 GB · ensemble + hiệu chỉnh ngưỡng (val có đủ 5 tar)"
  train:    "4 file · 5.74 GB · train lại detector headline (mặc định KHÔNG làm)"
  trainx:   "7 file · 11.24 GB · train lại detector cross-domain"
  trainens: "3 file · 14.60 GB · train 3 detector ensemble — chỉ khi thật sự train lại"
  rawx:     "4 file · 4.48 GB · ảnh gốc để TỰ tính lại DIRE (cần GPU + ADM 2.5 GB)"
  rawxens:  "6 file · 12.10 GB · ảnh gốc cho ensemble — mặc định KHÔNG"
  ckpts:    "6 file · 1.58 GB · toàn bộ checkpoint detector DIRE (mỗi file 269.4 MB)"
