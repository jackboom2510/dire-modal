# ============================================================================
# CHÍNH SÁCH TẢI DỮ LIỆU — nguồn sự thật cho tier mặc định / trần dung lượng /
# số container song song.
#
# File này nằm TRONG package (src/dire_modal/) chứ không phải configs/ ở repo
# root, vì Modal chỉ đóng gói thư mục của module được chạy — function chạy
# trong container sẽ thấy /root/dire_modal/tiers.yaml nhưng KHÔNG thấy
# /root/configs/. manifest.py::load_policy() đọc file này và có fallback cứng
# nếu thiếu, nên pipeline không bao giờ chết vì config.
#
# Danh sách FILE cụ thể nằm ở manifest.py (inventory); file này chỉ chứa
# POLICY. Tách đôi như vậy để đổi chính sách không phải đụng inventory.
#
# Mọi con số GB dưới đây là SỐ ĐO THẬT từ `download::audit` ngày 2026-10-21,
# không phải ước lượng.
# ============================================================================
version: 2

# Tier tải mặc định khi không truyền --tiers.
#   e2 = eval headline DIRE trên LSUN-Bedroom (1 ckpt + 16 tar test) = 1.94 GB
#   e4 = eval AEROBLADE trên ảnh gốc (5 tar images/)                 = 1.45 GB
#   ---------------------------------------------------------------
#   Tổng 22 file = 3.39 GB, so với 61.40 GB toàn cây đã audit.
# Tier A cũ (20 file) thực tế là 7.42 GB — docs từng ghi "40–70 GB" là lấy số
# của CẢ CÂY gán nhầm cho Tier A.
default_tiers: "e2,e4"

# Trần dung lượng cho MỘT lần `main --mode fetch`. Vượt → từ chối, không tải.
#
# 25 GB được chọn có chủ đích sau khi có số đo thật:
#   * eval đầy đủ không train (e2+e3+e4+e5) = 10.35 GB  → lọt, đúng ý
#   * thêm e4x (AEROBLADE mọi generator)     = 12.37 GB  → lọt, đúng ý
#     (e4 ⊂ e4x nên union là 69 file, không phải 57+17 — expand() khử trùng
#      lặp theo đường dẫn remote, không theo object)
#   * trainens một mình (3 tar train)        = 14.60 GB  → lọt (cần nếu train)
#   * train + trainx + trainens + rawx*      = 48.16 GB  → CHẶN
# tức trần này chặn được việc vô tình kéo cả đống dữ liệu train (47 GB = 77%
# cả cây) trong khi vẫn đủ rộng cho mọi tổ hợp eval.
#
# Guard so với ƯỚC LƯỢNG BẢO THỦ, không phải tổng size đã biết: file nào ls -l
# không đọc được size thì bị tính bằng file lớn nhất đã biết. Nếu chỉ so tổng
# đã biết thì guard là cận dưới và sẽ vô hiệu đúng lúc cần nó nhất.
max_gb: 25.0

# Số container tải song song TỐI ĐA.
# Báu hiểm ở chỗ này: tài khoản Baidu free bị throttle theo số phiên đồng thời.
# Code cũ KHÔNG đặt max_containers và tham số --concurrency bị bỏ qua hoàn toàn,
# nên .map() bung ~26 container một lúc → server cắt băng thông → hàng loạt task
# đứng ở "0B/s in 10m". Đo thật trong log: 67.36 KB/s cho một phiên đơn lẻ.
# 2 là giá trị an toàn suy ra từ log đó. Muốn nhanh hơn nữa thì chạy
# BaiduPCS-Go LOCAL rồi đẩy lên HF Hub, không qua Modal.
max_containers: 2

# Số lần thử lại cho MỖI file. Retry nằm BÊN TRONG fetch_one (vòng lặp thủ công)
# chứ không dựa vào modal.Retries, vì exception lọt ra ngoài .map() sẽ huỷ toàn
# bộ đợt tải và làm mất mọi file đang tải dở ở /tmp.
fetch_attempts: 3

# Timeout cho MỘT lệnh BaiduPCS-Go (giây) = 90 phút.
# Code cũ không đặt timeout ⇒ một phiên treo ở 0B/s có thể ngồi đó tới timeout
# của function (6 giờ) mà không bị giết.
# 5400s là cần thiết, không phải dư: tar lớn nhất đo được là 692.8 MB
# (dire/test/imagenet/lsun_bedroom/adm.tar.gz), ở 67 KB/s thì cần ~2.9 giờ —
# nghĩa là file đó CÓ THỂ cần nhiều hơn 1 attempt. Thư mục tmp ổn định theo
# hash đường dẫn remote nên attempt sau resume được mảnh dở, không tải lại.
subprocess_timeout: 5400

# Ghi chú mục đích từng tier — chỉ để in ra cho người đọc, không ảnh hưởng logic.
# Số file và GB là số đo thật (audit 2026-10-21).
tiers:
  e0:       "code/tooling/docs — 0 file, không tải gì từ Baidu"
  e1:       "demo AEROBLADE zero-shot — 0 file Baidu; chỉ cần VAE (~1 GB) từ HF Hub"
  e2:       "17 file · 1.94 GB · eval headline DIRE trên LSUN-Bedroom, 16 generator ⭐"
  e3:       "24 file · 4.85 GB · cross-domain: +10 tar lsun/imagenet, ImageNet, CelebA-HQ"
  e4:       "5 file · 1.45 GB · eval AEROBLADE trên ẢNH GỐC (nhánh images/) ⭐"
  e4x:      "17 file · 3.47 GB · AEROBLADE MỌI generator (DirSpec, tự loại 8 file ddim)"
  e5:       "11 file · 2.11 GB · ensemble + hiệu chỉnh ngưỡng (val có đủ 5 tar)"
  train:    "4 file · 5.74 GB · train lại detector headline (mặc định KHÔNG làm)"
  trainx:   "7 file · 11.24 GB · train lại detector cross-domain"
  trainens: "3 file · 14.60 GB · train 3 detector ensemble — chỉ khi thật sự train lại"
  rawx:     "4 file · 4.48 GB · ảnh gốc để TỰ tính lại DIRE (cần GPU + ADM 2.5 GB)"
  rawxens:  "6 file · 12.10 GB · ảnh gốc cho ensemble — mặc định KHÔNG"
  ckpts:    "6 file · 1.58 GB · toàn bộ checkpoint detector DIRE (mỗi file 269.4 MB)"
